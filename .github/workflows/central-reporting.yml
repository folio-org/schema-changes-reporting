name: Run Schema Changes Reporting

on:
  workflow_dispatch:
    inputs:
      base:
        description: "BASE (previous) release tag, e.g. R1-2025-csp-4. Leave empty to auto-detect the previous release."
        required: false
      head:
        description: "HEAD (current) release tag, e.g. R1-2025-csp-5. Leave empty to auto-detect the latest release."
        required: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pull-requests: write
  actions: write

jobs:
  # ──────────────────────────────────────────────────────────────────────
  # Resolve the list of modules + their base/head tags from platform-lsp.
  # The target module list lives in .github/config/modules.json — adding a
  # new module is a one-line change there (no YAML/bash edits required).
  # ──────────────────────────────────────────────────────────────────────
  tags-resolving:
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.resolve.outputs.modules }}
    steps:
      - name: Checkout workflow repo (configs + scripts)
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            .github/config
            .github/scripts
          sparse-checkout-cone-mode: false

      - name: Resolve module tags from platform-lsp releases
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_BASE: ${{ inputs.base }}
          INPUT_HEAD: ${{ inputs.head }}
        run: bash .github/scripts/releases-resolver.sh

  # ──────────────────────────────────────────────────────────────────────
  # Fan-out: run the reusable schema-diff workflow for each resolved module.
  # ──────────────────────────────────────────────────────────────────────
  diff:
    needs: [tags-resolving]
    if: ${{ needs.tags-resolving.outputs.modules != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.tags-resolving.outputs.modules) }}
    uses: ./.github/workflows/reusable-schema-changes.yml
    with:
      base: ${{ matrix.module.base }}
      head: ${{ matrix.module.head }}
      repository: folio-org/${{ matrix.module.name }}
      artifact_name: ${{ matrix.module.name }}
    secrets: inherit

  # ──────────────────────────────────────────────────────────────────────
  # Fan-in: collect per-module reports, combine into MD + HTML, upload.
  # ──────────────────────────────────────────────────────────────────────
  collecting-reports:
    needs: [diff]
    if: ${{ always() && needs.diff.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workflow repo (scripts)
        uses: actions/checkout@v6
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - name: Download all report artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: mod-*
          path: reports
          merge-multiple: false

      - name: Verify reports downloaded
        run: |
          COUNT=$(find reports -type f -name 'report.md' 2>/dev/null | wc -l)
          echo "Found ${COUNT} report(s)"
          if [[ "$COUNT" -eq 0 ]]; then
            echo "::error::No report artifacts found"
            exit 1
          fi

      - name: Set report timestamp
        id: ts
        run: echo "dt=$(date -u +'%Y-%m-%d_%H-%M-%S')" >> "$GITHUB_OUTPUT"

      - name: Install pandoc
        run: sudo apt-get update -qq && sudo apt-get install -y -qq pandoc

      - name: Build combined report
        env:
          TIMESTAMP: ${{ steps.ts.outputs.dt }}
        run: bash .github/scripts/reports-combiner.sh

      - name: Delete per-module report artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/artifacts-cleaner.sh

      - name: Upload combined report
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: report_${{ steps.ts.outputs.dt }}
          path: |
            report_${{ steps.ts.outputs.dt }}.html
            report_${{ steps.ts.outputs.dt }}.md

      - name: Add download link to summary
        run: |
          ARTIFACT_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts/${{ steps.upload.outputs.artifact-id }}"
          {
            echo "## 📄 Schema Changes Report"
            echo ""
            echo "**[⬇ Download report_${{ steps.ts.outputs.dt }}](${ARTIFACT_URL})**"
          } >> "$GITHUB_STEP_SUMMARY"

