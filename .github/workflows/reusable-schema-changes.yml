name: Schema changes (reusable action - NOT TO RUN DIRECTLY)

# ─────────────────────────────────────────────────────────────────────────
# Thin orchestrator: the heavy lifting lives in .github/scripts/
# so that logic can be edited, linted and locally tested without the
# YAML "bash in strings" overhead. Keep this file minimal.
# ─────────────────────────────────────────────────────────────────────────

on:
  workflow_call:
    inputs:
      base:
        description: "Optional base ref (tag/commit)"
        required: false
        type: string
      head:
        description: "Optional head ref (tag/commit)"
        required: false
        type: string
      repository:
        required: false
        type: string
      artifact_name:
        required: false
        type: string
      schema_paths:
        description: >
          Space-separated list of additional pathspec globs for JSON schema
          files (e.g. 'src/main/resources/schemas/**/*.json').
          The default 'ramls/**/*.json' is always included.
        required: false
        type: string
        default: ''

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: schema-diff-${{ inputs.repository || github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      # Target module repo: full history + submodules; blob-less filter
      # lets git lazy-fetch only the blobs actually inspected by the diff.
      - name: Checkout target repo (full history incl. tags + submodules)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          repository: ${{ inputs.repository || github.repository }}
          submodules: recursive
          filter: blob:none

      # Bring in our helper scripts alongside the target checkout.
      - name: Checkout workflow scripts
        uses: actions/checkout@v6
        with:
          repository: folio-org/schema-changes-reporting
          path: .schema-changes-reporting
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - name: Determine BASE/HEAD refs
        id: refs
        env:
          INPUT_BASE: ${{ inputs.base }}
          INPUT_HEAD: ${{ inputs.head }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: bash .schema-changes-reporting/.github/scripts/refs-resolver.sh

      - name: Build schema-changes report
        env:
          BASE: ${{ steps.refs.outputs.base }}
          HEAD: ${{ steps.refs.outputs.head }}
          REPO_NAME: ${{ inputs.repository || github.repository }}
          EXTRA_PATHS: ${{ inputs.schema_paths }}
          REPORT_FILE: report.md
        run: bash .schema-changes-reporting/.github/scripts/report-builder.sh

      - name: Ensure report exists
        if: ${{ github.event_name == 'pull_request' }}
        run: test -s report.md || { echo "::error::report.md is missing or empty"; exit 1; }

      - name: Comment PR with report
        if: ${{ github.event_name == 'pull_request' }}
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: "Schema Changes Report"
          recreate: true
          path: report.md

      - name: Upload report artifact (MD)
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_name || format('report-{0}-{1}', github.run_id, github.job) }}
          path: report.md
          if-no-files-found: error
          retention-days: 1

